<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swetha Vidapanakal | Data Analyst</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background-color: #0a0f1c;
  color: #e2e8f0;
  line-height: 1.6;
  overflow-x: hidden;
}

nav { text-align: center; padding: 20px; background: #1e293b; position: sticky; top: 0; z-index: 10; }
nav a { color: #38bdf8; text-decoration: none; margin: 0 15px; font-weight: 600; }
nav a:hover { text-decoration: underline; }

.hero {
  position: relative;
  min-height: 95vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
  overflow: hidden;
  background-color: #05070d;
  background-image:
    radial-gradient(circle at 50% 30%, #111827 0%, #05070d 65%),
    radial-gradient(#1e293b 1px, transparent 1px);
  background-size: 100% 100%, 26px 26px;
}
.hero::before, .hero::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0.25;
  z-index: 0;
}
.hero::before { width: 320px; height: 320px; background: #38bdf8; top: -80px; left: -60px; }
.hero::after { width: 280px; height: 280px; background: #6366f1; bottom: -70px; right: -60px; }

.hero-content { position: relative; z-index: 1; width: 100%; max-width: 700px; }

.photo-wrap {
  position: relative;
  width: 250px;
  height: 250px;
  margin: 0 auto 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.photo-glow {
  position: absolute;
  width: 290px;
  height: 290px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.15) 55%, transparent 75%);
  filter: blur(4px);
  z-index: 0;
}
.photo-ring {
  position: absolute;
  width: 272px;
  height: 272px;
  border-radius: 50%;
  border: 1.5px dashed rgba(56, 189, 248, 0.6);
  z-index: 1;
  animation: spin 18s linear infinite;
}
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.profile-pic {
  position: relative;
  z-index: 2;
  width: 250px;
  height: 250px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #0a0f1c;
  box-shadow: 0 0 40px rgba(255,255,255,0.25);
}

.hero h1 { font-size: 2.6rem; color: #f1f5f9; margin-bottom: 10px; }
.hero h1 span { color: #38bdf8; }

.tagline {
  font-size: 1.15rem;
  color: #94a3b8;
  min-height: 1.6em;
  border-right: 2px solid #38bdf8;
  white-space: nowrap;
  overflow: hidden;
  display: inline-block;
  max-width: 100%;
  margin-bottom: 26px;
}

.hero-buttons { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 22px; }
.btn {
  padding: 12px 26px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 600;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.btn-primary { background: #38bdf8; color: #0f172a; }
.btn-outline { background: transparent; color: #38bdf8; border: 2px solid #38bdf8; }
.btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(56,189,248,0.25); }

.socials a {
  color: #94a3b8;
  margin: 0 10px;
  font-size: 1.4rem;
  text-decoration: none;
  transition: color 0.2s ease;
}
.socials a:hover { color: #38bdf8; }

.stats { padding: 50px 20px; background: #1e293b; }
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  max-width: 700px;
  margin: 0 auto;
}
.stat-card {
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 14px;
  padding: 24px 10px;
  text-align: center;
  transition: transform 0.25s ease, border-color 0.25s ease;
}
.stat-card:hover { transform: translateY(-5px); border-color: #38bdf8; }
.stat-card .icon { font-size: 1.6rem; margin-bottom: 6px; }
.stat-card .num { font-size: 2rem; font-weight: 700; color: #38bdf8; }
.stat-card .label { color: #94a3b8; font-size: 0.8rem; margin-top: 4px; }

.skills-section { padding: 70px 20px; text-align: center; }
.skills-section h2 { color: #f1f5f9; font-size: 1.8rem; margin-bottom: 40px; }
.skills-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 20px;
  max-width: 900px;
  margin: 0 auto;
}
.skill-card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 22px 10px;
  transition: transform 0.25s ease, border-color 0.25s ease;
}
.skill-card:hover { transform: translateY(-5px); border-color: #38bdf8; }
.skill-card .icon { font-size: 1.8rem; margin-bottom: 8px; }
.skill-card .name { font-size: 0.9rem; color: #e2e8f0; }

footer { text-align: center; padding: 40px 20px; color: #64748b; border-top: 1px solid #1e293b; }

@media (max-width: 480px) {
  .tagline { font-size: 0.85rem; white-space: normal; text-align: center; }
  .hero h1 { font-size: 2rem; }
  .photo-wrap { width: 170px; height: 170px; }
  .photo-glow { width: 200px; height: 200px; }
  .photo-ring { width: 186px; height: 186px; }
  .profile-pic { width: 170px; height: 170px; }
  .stats-grid { gap: 10px; }
  .stat-card { padding: 14px 4px; }
  .stat-card .num { font-size: 1.3rem; }
  .stat-card .label { font-size: 0.65rem; }
  .stat-card .icon { font-size: 1.2rem; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="projects.html">Projects</a>
  <a href="about.html">About</a>
</nav>

<section class="hero">
  <div class="hero-content">
    <div class="photo-wrap">
      <div class="photo-glow"></div>
      <div class="photo-ring"></div>
      <img class="profile-pic" src="profile.jpg" alt="Swetha Vidapanakal">
    </div>
    <h1>Hi, I'm <span>Swetha</span></h1>
    <div class="tagline" id="typedTagline"></div>
    <div class="hero-buttons">
      <a class="btn btn-primary" href="projects.html">View Projects</a>
      <a class="btn btn-outline" href="mailto:swethavidapanakal@gmail.com">Get in Touch</a>
    </div>
    <div class="socials">
      <a href="https://www.linkedin.com/in/vidapanakal-swetha/" target="_blank">LinkedIn</a>
      <a href="https://github.com/VidapanakalSwetha" target="_blank">GitHub</a>
    </div>
  </div>
</section>

<section class="stats">
  <div class="stats-grid">
    <div class="stat-card"><div class="icon">🚀</div><div class="num" data-target="8">0</div><div class="label">Projects Built</div></div>
    <div class="stat-card"><div class="icon">💼</div><div class="num" data-target="3">0</div><div class="label">Internships</div></div>
    <div class="stat-card"><div class="icon">🛠️</div><div class="num" data-target="6">0</div><div class="label">Tools & Languages</div></div>
  </div>
</section>

<section class="skills-section">
  <h2>Tools I Work With</h2>
  <div class="skills-grid">
    <div class="skill-card"><div class="icon">📊</div><div class="name">Power BI</div></div>
    <div class="skill-card"><div class="icon">📈</div><div class="name">Excel</div></div>
    <div class="skill-card"><div class="icon">🗄️</div><div class="name">SQL</div></div>
    <div class="skill-card"><div class="icon">🐍</div><div class="name">Python</div></div>
    <div class="skill-card"><div class="icon">📉</div><div class="name">Tableau</div></div>
    <div class="skill-card"><div class="icon">🔗</div><div class="name">Power Query</div></div>
  </div>
</section>

<footer>
  <p>© 2026 Swetha Vidapanakal. Built with GitHub Pages.</p>
</footer>

<script>
const taglineText = "Aspiring Data Analyst | Turning Raw Data into Clear Decisions";
const taglineEl = document.getElementById('typedTagline');
let i = 0;
function typeTagline() {
  if (i <= taglineText.length) {
    taglineEl.textContent = taglineText.slice(0, i);
    i++;
    setTimeout(typeTagline, 45);
  } else {
    taglineEl.style.borderRight = "none";
  }
}
typeTagline();

const counters = document.querySelectorAll('.stat-card .num');
const speed = 60;
function animateCounters() {
  counters.forEach(counter => {
    const target = +counter.getAttribute('data-target');
    let count = 0;
    const increment = Math.max(target / speed, 1);
    function update() {
      count += increment;
      if (count < target) {
        counter.textContent = Math.ceil(count);
        requestAnimationFrame(update);
      } else {
        counter.textContent = target;
      }
    }
    update();
  });
}
const statsSection = document.querySelector('.stats');
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      animateCounters();
      observer.disconnect();
    }
  });
}, { threshold: 0.3 });
observer.observe(statsSection);
</script>

</body>
</html>
